<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Attendance App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Class Attendance</h1>
        <form id="attendance-form">
            <div class="list">
                <div class="student">
                    <label for="s1">Neeraj Kumar</label>
                    <input type="radio" name="s1" value="present"> Present
                    <input type="radio" name="s1" value="absent"> Absent
                    <input type="radio" name="s1" value="given"> Given
                </div>
                <div class="student">
                    <label for="s2">Sahil Kumar</label>
                    <input type="radio" name="s2" value="present"> Present
                    <input type="radio" name="s2" value="absent"> Absent
                    <input type="radio" name="s2" value="given"> Given
                </div>
                <div class="student">
                    <label for="s3">MD Waseem</label>
                    <input type="radio" name="s3" value="present"> Present
                    <input type="radio" name="s3" value="absent"> Absent
                    <input type="radio" name="s3" value="given"> Given
                </div>
                <div class="student">
                    <label for="s4">Karthik Rajak</label>
                    <input type="radio" name="s4" value="present"> Present
                    <input type="radio" name="s4" value="absent"> Absent
                    <input type="radio" name="s4" value="given"> Given
                </div>
                <div class="student">
                    <label for="s5">Sai Kiran</label>
                    <input type="radio" name="s5" value="present"> Present
                    <input type="radio" name="s5" value="absent"> Absent
                    <input type="radio" name="s5" value="given"> Given
                </div>
                <div class="student">
                    <label for="s6">Ranvijay Singh</label>
                    <input type="radio" name="s6" value="present"> Present
                    <input type="radio" name="s6" value="absent"> Absent
                    <input type="radio" name="s6" value="given"> Given
                </div>
                <div class="student">
                    <label for="s7">Manoj Reddy</label>
                    <input type="radio" name="s7" value="present"> Present
                    <input type="radio" name="s7" value="absent"> Absent
                    <input type="radio" name="s7" value="given"> Given
                </div>
                <div class="student">
                    <label for="s8">Eshwar Goud</label>
                    <input type="radio" name="s8" value="present"> Present
                    <input type="radio" name="s8" value="absent"> Absent
                    <input type="radio" name="s8" value="given"> Given
                </div>
            </div>
            <button type="submit">Mark Attendance</button>
        </form>

        <h2>Attendance Summary</h2>
        <ul id="list">
      
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
